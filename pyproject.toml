[build-system]
requires = ["setuptools >= 77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spacenet"
description = "Space Exploration Campaign Logistics Simulation"
authors = [
    {"name" = "Paul T. Grogan", "email" = "paul@ptgrogan.com"},
    {"name" = "Sarah Bentley", "email" = "sbentley@mit.edu"}
]
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Operating System :: OS Independent",
    "Development Status :: 2 - Pre-Alpha"
]
dependencies = [
    "enum-tools[sphinx] >= 0.12.0",
    "fastapi-camelcase >= 2.0.0",
    "numpy >= 1.26.0",
    "openpyxl >= 3.1.2",
    "pandas >= 2.1.0",
    "python-dateutil >= 2.9.0",
    "pydantic >= 2.5"
]
dynamic = ["version"]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
test = [
    "coverage >= 7.6.0",
    "httpx >= 0.27.0",
    "pytest >= 8.0.0"
]
docs = [
    "autodoc_pydantic >= 2.2.0",
    "myst-parser >= 4.0.0",
    "sphinx >= 7.4.0, < 9",  # enum-tools autoenum is incompatible with sphinx 9
    "sphinx-rtd-theme >= 3.0.0"
]
lint = [
    "black >= 25.1.0",
    "pylint >= 3.3.0",
    "pylint-pydantic >= 0.3.5"
]
app = [
    "aiosqlite >= 0.20.0",
    "python-dotenv >= 1.0.1",
    "fastapi >= 0.115.0",
    "fastapi-users[sqlalchemy] >= 14.0.0",
    "python-multipart >= 0.0.9",
    "uvicorn[standard] >= 0.32.0"
]

[tool.setuptools.dynamic]
version = {attr = "spacenet.__version__"}

[tool.pytest.ini_options]
markers = [
    "slow: long-running tests (excluded in continuous integration with -m \"not slow\")",
]
